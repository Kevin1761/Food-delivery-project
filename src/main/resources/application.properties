
spring.application.name=Springboot_demo

# ?????
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/takeout?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis 配置：指定 XML 映射文件位置
mybatis.mapper-locations=classpath*:org/example/springboot_demo/server/mapper/*.xml
debug=true

# JSON date/time format configuration
# 输出序列化：将LocalDateTime输出为字符串
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
# 输入反序列化：将字符串解析为LocalDateTime
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.time-zone=Asia/Shanghai